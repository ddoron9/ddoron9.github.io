run:
  id: run_ytvis_person_v2_yolo11x_bisenetv2_coarse_fresh
  seed: 42
  output_dir: outputs/run_ytvis_person_v2_yolo11x_bisenetv2_coarse_fresh

task:
  type: binary_foreground_segmentation
  mask_policy: reports/2026-03-17_segmentation_mask_policy.md

model:
  name: bisenetv2
  pretrained: false
  num_classes: 2

data:
  input_size: [320, 512]
  maintain_aspect: true
  train_mix:
    - manifest: localdata/youtube_vis_person_v2_yolo11x_seg/manifests/youtube_vis_person_train.csv
      weight: 1.0
  val_sets:
    - localdata/youtube_vis_person_v2_yolo11x_seg/manifests/youtube_vis_person_val.csv
  loader:
    workers: 0
    batch_size: 2
    pin_memory: false

augment:
  hflip: 0.5
  random_resized_crop: true
  brightness_contrast: 0.2
  jpeg_compression: 0.2
  gaussian_noise: 0.1
  motion_blur: 0.1

train:
  epochs: 100
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  amp: false
  grad_clip: 1.0

loss:
  ce: 1.0
  dice: 1.0
  auto_class_weights: true
  class_weight_sample_limit: 128

infer:
  refine: false
  temporal: none
  threshold: 0.5

eval:
  metrics:
    - iou
    - dice
